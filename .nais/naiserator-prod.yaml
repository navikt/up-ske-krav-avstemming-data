apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: up-ske-krav-avstemming-data
  namespace: okonomi
  labels:
    team: okonomi
  annotations:
    config.linkerd.io/proxy-memory-limit: "512Mi"
    config.linkerd.io/proxy-memory-request: "128Mi"
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /up-ske-krav-avstemming-data/internal/isAlive
    initialDelay: 10
  readiness:
    path: /up-ske-krav-avstemming-data/internal/isReady
    initialDelay: 10
  prometheus:
    enabled: true
    path: /up-ske-krav-avstemming-data/internal/metrics
  replicas:
    min: 2
    max: 2
  ingresses:
    - "https://utbetalingsportalen.intern.nav.no/up-ske-krav-avstemming-data"
    - "https://utbetalingsportalen.ansatt.nav.no/up-ske-krav-avstemming-data"
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
