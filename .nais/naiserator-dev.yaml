apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: up-ske-krav-avstemming-data
  namespace: okonomi
  labels:
    team: okonomi
spec:
  image: "{{ image }}"
  port: 8080
  liveness:
    path: /up-ske-krav-avstemming-data/internal/isAlive
    initialDelay: 10
  readiness:
    path: /up-ske-krav-avstemming-data/internal/isReady
    initialDelay: 10
  prometheus:
    enabled: true
    path: /up-ske-krav-avstemming-data/internal/metrics
  replicas:
    min: 1
    max: 2
  ingresses:
    - "https://utbetalingsportalen.intern.dev.nav.no/up-ske-krav-avstemming-data"
    - "https://utbetalingsportalen.ansatt.dev.nav.no/up-ske-krav-avstemming-data"
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
